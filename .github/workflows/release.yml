name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package macOS workflow as zip
        run: |
          cd mac
          zip -r "../Convert to WebP.workflow.zip" "Convert to WebP.workflow"

      - name: Package Windows scripts as zip
        run: |
          cd windows
          zip -r "../windows-scripts.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Convert to WebP.workflow.zip
            windows-scripts.zip
          generate_release_notes: true
