name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package workflow as zip
        run: |
          zip -r "Convert to WebP.workflow.zip" "Convert to WebP.workflow"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Convert to WebP.workflow.zip
          generate_release_notes: true
